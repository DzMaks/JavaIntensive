server.port=8081

spring.application.name=notification-service

spring.kafka.bootstrap-servers=${KAFKA_HOST:kafka}:${KAFKA_PORT:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.aston.common.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.aston.common.event.UserEvent

spring.mail.host=${MAIL_HOST:mailhog}
spring.mail.port=1025
app.mail.from=no-reply@aston.local

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true