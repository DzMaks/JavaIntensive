server:
  port: 8080


spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**


        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**



eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

    register-with-eureka: true
    fetch-registry: true